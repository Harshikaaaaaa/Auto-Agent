# AutoAgent — single-container app plus a MySQL database.
#
# Copy .env.example to .env and fill it in before running. Both the values and
# the secrets the app needs are pulled from .env by ${VAR} substitution, so this
# works under Docker Compose and under Finch/nerdctl alike:
#
#   docker compose up --build        # Docker
#   finch compose up --build         # Finch
#
# The app serves both the UI and the API on http://localhost:3234.
#
# NOTE (Finch): nerdctl-compose ignores `env_file`, `healthcheck`, and
# `depends_on: condition: service_healthy`. The app therefore reads its config
# from the explicit `environment:` block below (not env_file), and tolerates the
# database not being ready at first boot — `restart: unless-stopped` brings it up
# once MySQL is accepting connections. Under Docker Compose all three are honoured
# and the app waits for the db health check before starting.

services:
  db:
    image: mysql:9.4
    restart: unless-stopped
    environment:
      # MYSQL_ROOT_PASSWORD is read from your .env. For a throwaway local stack
      # you may instead set MYSQL_ALLOW_EMPTY_PASSWORD=yes, but a password is
      # required once NODE_ENV=production (the app enforces it).
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-autoagent}
    volumes:
      # Named volume so the data survives `docker compose down` (use
      # `down -v` to wipe it deliberately).
      - autoagent_db:/var/lib/mysql
    healthcheck:
      # The app waits on this: it will not start until the database is healthy.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published to the host by default; only the app needs to reach it.
    expose:
      - '3306'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # `env_file` passes the whole .env into the container under Docker Compose.
    # Finch/nerdctl-compose ignores env_file, so the secrets the app needs are
    # ALSO listed explicitly below via ${VAR} substitution — which both Compose
    # and Finch honour from .env. Keep them in sync with .env.example.
    env_file:
      - .env
    environment:
      # Override the host bits that must point at the compose network / container,
      # regardless of what .env says for a local (non-Docker) run.
      NODE_ENV: production
      PORT: '3234'
      DB_HOST: db
      DB_PORT: '3306'
      # The DB is reachable only over the private compose network (its port is
      # not published), so TLS to it is not required. This flag acknowledges
      # that so the production TLS check does not block startup.
      DB_SSL: 'false'
      DB_TRUST_PRIVATE_NETWORK: 'true'
      # Secrets and provider config, sourced from .env by substitution so they
      # reach the container even where env_file is ignored (Finch).
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Leave unset for HTTPS (defaults to secure in production). Set false in
      # .env for a plain-HTTP local run so cookies and assets are not blocked.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-autoagent}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      # Tier-2 JavaScript rendering (headless Chromium). Off unless you opt in;
      # the image bundles Chromium so this can be flipped to true without a rebuild.
      FETCH_RENDER_ENABLED: ${FETCH_RENDER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3234:3234'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3234/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  autoagent_db:
