<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAgent Studio</title>
    <!--
    This page deliberately loads NO third-party scripts, styles, or fonts.

    It used to load Tailwind, the app fonts, react-flow's stylesheet, and an
    import map for react/reactflow/lucide from external hosts. All of that was
    development-only and shipped an unbundled, uncacheable, CSP-hostile page.
    Task 15 moved every one of them into the Vite build:
      - Tailwind        -> a real PostCSS build (tailwind.config.js + postcss.config.js)
      - fonts           -> bundled @fontsource packages (see src/app/index.css)
      - react-flow CSS  -> imported in src/app/main.tsx
      - react/etc.      -> bundled by Vite; the import map is gone
    The CSS entry is imported from main.tsx, so Vite injects the built
    stylesheet link automatically — there is no <link> to a CSS file here.
  --></head>

  <body class="overflow-hidden bg-[#050505]">
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
