<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoAgent Studio</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bolt: {
              bg: '#050505',
              sidebar: '#0a0a0a',
              panel: '#111111',
              accent: '#2dd4bf', // Teal accent like in images
              border: '#1a1a1a'
            }
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #e5e7eb;
      letter-spacing: -0.01em;
    }

    .react-flow__node {
      border-radius: 12px !important;
    }

    .react-flow__handle {
      width: 8px !important;
      height: 8px !important;
      background: #2dd4bf !important;
      border: 2px solid #050505 !important;
      box-shadow: 0 0 10px rgba(45, 212, 191, 0.4);
    }

    .react-flow__edge-path {
      stroke-width: 1.5;
      stroke: #333;
    }

    .react-flow__controls {
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8) !important;
      border: 1px solid #1a1a1a !important;
      border-radius: 12px !important;
      background: rgba(20, 20, 20, 0.8) !important;
      backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      padding: 4px;
      gap: 4px;
    }

    .react-flow__controls-button {
      border: none !important;
      background: transparent !important;
      fill: #9ca3af !important;
      border-radius: 6px !important;
      width: 32px !important;
      height: 32px !important;
    }

    .react-flow__controls-button:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      fill: white !important;
    }

    .react-flow__attribution {
      display: none;
    }

    /* Grid background effect from image */
    .bg-grid {
      background-image:
        linear-gradient(to right, #111 1px, transparent 1px),
        linear-gradient(to bottom, #111 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Glassmorphism for panels */
    .glass-panel {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #333;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "reactflow": "https://esm.sh/reactflow@11.11.4?external=react,react-dom",
    "reactflow/": "https://esm.sh/reactflow@11.11.4/",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="overflow-hidden bg-[#050505]">
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
